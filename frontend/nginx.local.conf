# ============================================================
# TicketHub 本地/组员环境的 nginx 配置
#
# 与生产版 deploy/nginx/tickethub.conf 的区别：
#   - 不监听公网 IP，只作为容器内的 80 端口
#   - 不做限流（本地测试时连续点抢票不该被 429 打断）
#   - 反代目标是 compose 服务名 app:8081，不是 127.0.0.1
#   - 上传图片从共享卷 /opt/tickethub/uploads 读取
# ============================================================

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS。用变量 + resolver 而不是直接写 proxy_pass http://app:8081，
    # 原因：nginx 在「启动时」解析 upstream 域名，如果那时 app 容器还没就绪，
    # nginx 会直接启动失败并报 "host not found in upstream"。
    # 改成运行时解析后，nginx 先起来，app 起来后请求自动通，最多前几秒 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "app:8081";

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 图片：先找前端内置演示图，找不到再找后端上传目录
    location /imgs/ {
        try_files $uri @uploads;
    }
    location @uploads {
        rewrite ^/imgs/(.*)$ /$1 break;
        root /opt/tickethub/uploads;
    }

    # API 反代：/api/xxx -> app:8081/xxx
    # 去掉 /api 前缀，和后端 @RequestMapping("/user") 这类路径对齐。
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vue Router history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
# TicketHub 单机部署编排（Ubuntu ECS / 2核2G / 无域名 HTTP）
#
# 启动：docker compose up -d
# 日志：docker compose logs -f app
# 停止：docker compose down          （数据卷保留）
# 清库：docker compose down -v       （会删除 MySQL/Redis/MQ 数据，慎用）
#
# 本文件默认配合 Dockerfile.runtime 使用：jar 包在前端本地构建好再上传，
# 服务器只负责运行，避免 2G 内存的机器上跑 Maven 编译被 OOM Kill。
# ============================================================

services:
  # ---------- 后端应用 ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: tickethub-app:latest
    container_name: tickethub-app
    restart: always

    # 只绑定到宿主机回环地址：外网无法直连 8081，
    # 所有请求必须经过宿主机 nginx（限流/日志/后续负载均衡都在那里）。
    ports:
      - "127.0.0.1:8081:8081"

    environment:
      TZ: Asia/Shanghai

      # JVM 堆参数。2核2G 机器上必须限制，否则 JVM 默认按物理内存的 1/4
      # 取堆，容器极易被 OOM Killer 干掉。
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx512m -XX:MaxMetaspaceSize=160m -Xss512k -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}"

      MYSQL_URL: jdbc:mysql://mysql:3306/tickethub?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      MYSQL_USERNAME: ${MYSQL_USERNAME:-tickethub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-tickethub}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}

      # OSS 未启用时上传落到本地目录，由 nginx 的 /imgs/ 托管
      UPLOAD_LOCAL_DIR: /app/uploads
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_URL_PREFIX: ${OSS_URL_PREFIX:-}

    volumes:
      # 用户上传的图片持久化到宿主机 /opt/tickethub/uploads，
      # 与 nginx 的 location @tickethub_uploads 指向同一目录。
      - ./uploads:/app/uploads

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

    # 内存上限：容器内进程组超过这个值会被 cgroup 限制（不会拖垮整机）
    # 内存上限可用 .env 的 APP_MEM_LIMIT 覆盖：标准 800m / 精简 512m
    mem_limit: ${APP_MEM_LIMIT:-800m}

    networks: [tickethub]

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: tickethub-mysql
    restart: always

    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tickethub
      MYSQL_USER: ${MYSQL_USERNAME:-tickethub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}

    # 2G 内存的机器上，MySQL 默认配置（buffer pool 128M + performance_schema）
    # 会吃掉 600M+。这里把 buffer pool 压到 128M 并关掉 performance_schema，
    # 常驻内存能降到 350M 左右。演示环境完全够用。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-128M}
      - --performance-schema=OFF
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-100}

    volumes:
      - mysql-data:/var/lib/mysql
      # 只在数据卷为空（首次启动）时执行，用于建表 + 灌演示数据。
      # 之后重启不会重复执行，所以不会覆盖你抢到的订单。
      - ./src/main/resources/db/tickethub.sql:/docker-entrypoint-initdb.d/01-tickethub.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      # 首次启动要建库 + 导入演示数据，2核2G 上可能要 2-3 分钟。
      # start_period 太短会让 compose 在初始化还没完成时就判定 unhealthy，
      # 然后直接放弃启动 app（实测踩过：表数为 0、app 停在 Created 状态）。
      retries: 30
      start_period: 120s

    # 标准 500m / 精简 360m
    mem_limit: ${MYSQL_MEM_LIMIT:-500m}
    networks: [tickethub]

  # ---------- Redis ----------
  redis:
    image: redis:7
    container_name: tickethub-redis
    restart: always

    # maxmemory-policy 必须用 volatile-lru 而不是 allkeys-lru：
    # 秒杀库存 key（seckill:stock:*）没有 TTL，allkeys-lru 可能在内存吃紧时
    # 把库存淘汰掉，导致 Lua 脚本返回 -1「库存未预热」而抢票直接失败。
    # volatile-lru 只淘汰设置了过期时间的 key（登录 token、缓存等），业务安全。
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
                 --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy volatile-lru;
             else
               redis-server --appendonly yes
                 --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy volatile-lru;
             fi'

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}

    volumes:
      - redis-data:/data

    # 标准 256m / 精简 160m
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    networks: [tickethub]

  # ---------- RabbitMQ ----------
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: tickethub-rabbitmq
    restart: always

    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-tickethub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
      # Erlang VM 默认会按「检测到的内存」申请，在 2G 机器上容易吃满。
      # 这里必须用绝对值（如 128MB）而不是相对值 0.4：
      # 相对值按检测到的内存算，若容器内检测到宿主机 2G，阈值会变成 800M，
      # 反而超过本容器 300m 的 mem_limit，水位线还没触发就被 OOM Killer 杀掉。
      #
      # ⚠️ RabbitMQ 3.12 起，下面两种环境变量写法都会让容器**直接退出**（实测踩过）：
      #   1) RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS="-rabbit vm_memory_high_watermark.absolute 256MB"
      #      → Erlang 把点号当记录语法，报 syntax error before: '.'
      #   2) RABBITMQ_VM_MEMORY_HIGH_WATERMARK=128MB
      #      → 报 "is set but deprecated" 然后拒绝启动
      # 官方现在只认配置文件，所以改成挂载 deploy/rabbitmq/rabbitmq.conf。
      # 要调水位就改那个文件里的 vm_memory_high_watermark.absolute。

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # 内存水位配置（3.12+ 必须用配置文件，环境变量已弃用）
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-tickethub.conf:ro

    # 标准 400m / 精简 300m
    mem_limit: ${RABBITMQ_MEM_LIMIT:-400m}
    networks: [tickethub]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  tickethub:
    driver: bridge

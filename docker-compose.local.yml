# ============================================================
# TicketHub 本地「快速模式」——直接用已构建好的产物
#
# 前提：本地已经执行过
#   mvn -DskipTests package          → target/ticket-hub-0.0.1-SNAPSHOT.jar
#   cd frontend && npm run build     → frontend/dist/
#
# 启动（不编译，只拉 1 个基础镜像，30 秒内起来）：
#   docker compose -f docker-compose.local.yml up -d
#   浏览器 http://localhost:8080
#
# 改了 Java 代码 → 重新 mvn package，然后
#   docker compose -f docker-compose.local.yml up -d --build app
#
# 改了前端代码 → 重新 npm run build，然后
#   docker compose -f docker-compose.local.yml restart web
#   （前端是挂载进容器的，改 dist 只需重启，不用重建镜像）
#
# 组员第一次跑（没有 jar/dist）请用：
#   docker compose -f docker-compose.build.yml up -d --build
#
# 停止（保留数据）：
#   docker compose -f docker-compose.local.yml down
#
# 重置数据库：
#   docker compose -f docker-compose.local.yml down -v
#   docker compose -f docker-compose.local.yml up -d
#
# 端口说明（全部避开本机常见占用）：
#   8080  -> 网站首页
#   18081 -> 后端直连（调试用，正常走 8080/api）
#   13306 -> MySQL（本机已有 MySQL80 占了 3306，所以错开）
#   16379 -> Redis
#   15672 -> RabbitMQ 管理台（tickethub / tickethub_local_mq）
# ============================================================

services:
  # ---------- 后端 ----------
  app:
    build:
      context: .
      # 只 COPY jar，不在容器里跑 Maven：2 核机器编译会 OOM，
      # 本机虽然有 32G，但编译一次要 3-8 分钟，没必要。
      dockerfile: Dockerfile.runtime
    image: tickethub-app:local
    container_name: tickethub-local-app
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai
      # 本地机器内存通常 16G，不需要像 ECS 那样压到 512M
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"

      MYSQL_URL: jdbc:mysql://mysql:3306/tickethub?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      MYSQL_USERNAME: tickethub
      MYSQL_PASSWORD: tickethub_local_pwd

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: tickethub
      RABBITMQ_PASSWORD: tickethub_local_mq

      # 本地默认不开 OSS，上传落到共享卷，由 nginx 的 /imgs/ 托管
      UPLOAD_LOCAL_DIR: /app/uploads
      OSS_ENABLED: "false"

    volumes:
      - tickethub-uploads:/app/uploads

    ports:
      # 映射到 18081，方便 Postman/curl 直接打后端，不经过 nginx
      - "18081:8081"

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

    networks: [tickethub-local]

  # ---------- 前端 + nginx ----------
  web:
    # 不构建：直接用官方 nginx 镜像，把 dist 挂载进去。
    # 好处：改前端只需重新 npm run build + restart，不用重建镜像。
    image: nginx:1.27-alpine
    container_name: tickethub-local-web
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      # 前端产物（本地 npm run build 生成）
      - ./frontend/dist:/usr/share/nginx/html:ro
      # 容器内 nginx 站点配置
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      # 与 app 共用上传目录，/imgs/xxx 才能读到后端写入的图片
      - tickethub-uploads:/opt/tickethub/uploads:ro

    depends_on:
      - app

    networks: [tickethub-local]

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: tickethub-local-mysql
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root_local_pwd
      MYSQL_DATABASE: tickethub
      MYSQL_USER: tickethub
      MYSQL_PASSWORD: tickethub_local_pwd

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 本地机器内存充足，给大一点的 buffer pool，查询更快
      - --innodb-buffer-pool-size=256M

    volumes:
      - tickethub-mysql:/var/lib/mysql
      # 只在数据卷为空（首次启动）时执行，用来建表 + 灌演示数据
      - ./src/main/resources/db/tickethub.sql:/docker-entrypoint-initdb.d/01-tickethub.sql:ro

    ports:
      # 用 13306 而不是 3306：本机 MySQL80 服务已占用 3306
      - "13306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_local_pwd"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

    networks: [tickethub-local]

  # ---------- Redis ----------
  redis:
    image: redis:7
    container_name: tickethub-local-redis
    restart: unless-stopped

    # 本地不设密码、不限制 maxmemory：演示时不会有 key 被淘汰，
    # 库存 key 永远在，抢票链路行为最接近理想状态。
    command: redis-server --appendonly yes

    volumes:
      - tickethub-redis:/data

    ports:
      - "16379:6379"

    networks: [tickethub-local]

  # ---------- RabbitMQ ----------
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: tickethub-local-rabbitmq
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: tickethub
      RABBITMQ_DEFAULT_PASS: tickethub_local_mq

    volumes:
      - tickethub-rabbitmq:/var/lib/rabbitmq

    ports:
      - "15672:15672"   # 管理台
      - "5673:5672"     # AMQP（映射到 5673，避免与将来本机装 RabbitMQ 冲突）

    networks: [tickethub-local]

volumes:
  tickethub-mysql:
  tickethub-redis:
  tickethub-rabbitmq:
  tickethub-uploads:

networks:
  tickethub-local:
    driver: bridge

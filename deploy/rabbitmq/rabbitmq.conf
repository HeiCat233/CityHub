# ============================================================
# RabbitMQ 内存水位配置（3.12+ 推荐方式）
#
# 为什么不用环境变量：
#   3.12 起 RABBITMQ_VM_MEMORY_HIGH_WATERMARK 和
#   RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS 里的点号写法都会让容器直接退出：
#     - 环境变量方式 → "is set but deprecated" 然后 exit
#     - ERL_ARGS 方式 → Erlang 解析报 syntax error before: '.'
#   官方现在要求写配置文件，这里就是那个文件。
#
# 这个文件被挂载到容器内 /etc/rabbitmq/conf.d/10-tickethub.conf，
# 官方镜像启动时会自动读取该目录下的所有 .conf。
#
# absolute 而不是相对值 0.4：相对值按「检测到的内存」算，
# 容器里若检测到宿主机 2G，阈值会变成 800M，超过 mem_limit 就被 OOM 杀掉。
# ============================================================
vm_memory_high_watermark.absolute = 128MB
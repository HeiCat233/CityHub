# ============================================================
# fail2ban 过滤器：识别扫描器探测路径
#
# 放置位置：/etc/fail2ban/filter.d/tickethub-scanner.conf
# 日志来源：/var/log/nginx/tickethub-scan.log（combined 格式）
#
# 一行日志长这样：
#   1.2.3.4 - - [21/Oct/2026:14:43:37 +0800] "GET /.env HTTP/1.1" 444 0 "-" "curl/7.81.0"
#
# ------------------------------------------------------------
# 【必读】fail2ban 0.11.2 的一个大坑（我踩了整整一轮）
#
# <HOST> 展开后不是简单的 IP 正则，它自带边界断言（类似 (?![.\w-])）。
# 一旦后面紧跟 \s+ 、[^\]]+ 、.+ 这类「会回溯」的模式，
# 断言就和后续模式互相冲突，结果是 fail2ban-regex 显示 0 matched，
# 而同一行用 Python re.search 却能匹配 —— 极难排查。
#
# 实测对比（同一份日志、同一行）：
#   ^<HOST>\s+-\s+-\s+\[           -> 5 matched   （\s+ 后面直接跟 - 还行）
#   ^<HOST>\s+-\s+-\s+\[[^\]]+\]   -> 0 matched   （字符类触发断言冲突）
#   ^<HOST> - - \[.*?\]            -> 5 matched   ← 用这个
#   ^<HOST> - - \[[^]]+\]          -> 0 matched
#   ^<HOST> - - \[.+\]             -> 0 matched
#
# 结论：前缀固定写成 `^<HOST> - - \[.*?\]`（字面空格 + 非贪婪通配），
#       中间一律用 `.*?`，不要用 `\s+` 或字符类。
#       以后改这个文件，改完必须跑：
#         fail2ban-regex /var/log/nginx/tickethub-scan.log \
#                        /etc/fail2ban/filter.d/tickethub-scanner.conf
#       看到 "N matched" 才算改对。
# ------------------------------------------------------------
#
# 注意：这里**不能**用 access_log off。fail2ban 靠日志抓扫描器，
# 关掉日志等于让这层防护彻底失效。
# ============================================================

[Definition]

# 规则 1：敏感路径探测（凭据文件、版本库、后台入口、配置文件）
failregex = ^<HOST> - - \[.*?\] ".*?(?:/\.env|/\.git|/\.svn|/\.hg|/\.aws|/\.ssh|/\.DS_Store|/\.idea|/\.vscode|/\.htaccess|/\.htpasswd|/\.dockerenv|/wp-admin|/wp-login|/wp-content|/phpmyadmin|/adminer|/xmlrpc\.php|/config\.json|/config\.yml|/config\.yaml|/application\.properties|/application\.yml).*?" (?:444|403|404|400)
# 规则 2：备份 / 导出 / 压缩包探测
            ^<HOST> - - \[.*?\] ".*?\.(?:sql|bak|old|orig|swp|tgz|zip|7z|rar|tar\.gz).*?" (?:444|403|404|400)

ignoreregex =
# ============================================================
# TicketHub 生产部署配置（无域名 / HTTP / 单机 ECS）
#
# 放置位置：/etc/nginx/conf.d/tickethub.conf
# 角色：前端静态资源托管 + 上传图片托管 + API 反向代理 + 限流
#
# 为什么不用 OSS 托管前端：
#   阿里云 OSS 的默认域名（xxx.oss-cn-hongkong.aliyuncs.com）访问 .html
#   会被强制加上 Content-Disposition: attachment 变成「下载」而不是渲染，
#   必须绑定自定义域名才能当静态网站用。本项目暂不购买域名，
#   因此前端交给 nginx 托管；OSS 只用来存用户上传的图片。
# ============================================================

# ---- 限流区 ----
# limit_req_zone 必须写在 http 上下文里。本文件被 nginx.conf 的
# include /etc/nginx/conf.d/*.conf; 引入，而该 include 位于 http 块内，
# 所以直接写在这里是合法的。
#
# 抢票接口：按客户端 IP 限速 10 次/秒（突发 20），第一层防刷。
# 第二层防护在业务代码里：Redis + Lua 的库存校验与「一人一单」。
limit_req_zone $binary_remote_addr zone=tickethub_seckill:10m rate=10r/s;
# 其他接口：50 次/秒（突发 100）
limit_req_zone $binary_remote_addr zone=tickethub_api:10m rate=50r/s;

# ---- 后端上游 ----
# app 容器只把端口绑定到宿主机 127.0.0.1:8081，不直接对外，
# 所有流量必须经过这里，才能统一做限流、日志和后续的负载均衡。
upstream tickethub_backend {
    server 127.0.0.1:8081 weight=1 max_fails=3 fail_timeout=10s;
    # 将来横向扩容时再加一行，weight 控制权重，nginx 立即生效：
    # server 127.0.0.1:8082 weight=1 max_fails=3 fail_timeout=10s;

    # keepalive 复用与后端的 TCP 连接，降低握手开销。
    # 注意：它必须配合下面的 proxy_http_version 1.1 与 Connection "" 才有效，
    # 否则 nginx 仍会每个请求新建连接。
    keepalive 32;
}

server {
    # 没有域名，用 IP 直接访问，所以让它成为默认站点。
    # 部署脚本会删除 Ubuntu 自带的 /etc/nginx/sites-enabled/default，
    # 否则两个 default_server 会冲突导致 nginx 启动失败。
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    charset utf-8;
    client_max_body_size 10m;

    # 隐藏 nginx 版本号（默认返回 "Server: nginx/1.18.0 (Ubuntu)"，
    # 等于告诉扫描器这机器上有哪个 CVE 可用）。
    server_tokens off;

    # ---- 502 友好化 ----
    # 后端重启的那几秒，nginx 连不上 8081，默认会甩一个 nginx 自带的
    # 英文 502 页面（还带版本信息），看起来像"网站挂了"。
    # 这里改成：短暂重试一次，并把 502/503/504 换成中文提示页。
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 3s;
    error_page 502 503 504 = @tickethub_page_unavailable;

    # 前端构建产物目录（由 deploy.sh 或手动 scp 上传到此处）
    root /opt/tickethub/frontend/dist;
    index index.html;

    access_log /var/log/nginx/tickethub.access.log;
    error_log  /var/log/nginx/tickethub.error.log;

    # ---- 压缩 ----
    # 前端 JS/CSS 未压缩时有 1MB 左右，学生机带宽只有几 Mbps，
    # 开启 gzip 后首屏传输量能降到三分之一左右。
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- 带 hash 的构建产物：长期缓存 ----
    # Vite 打包出的文件名带内容 hash（如 index-a1b2c3d4.js），
    # 内容变了文件名就变，所以可以放心让浏览器缓存 30 天。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 图片 ----
    # 查找顺序：
    #   1. 前端内置的演示图（dist/imgs/shows/jay.jpg 等，随前端一起发布）
    #   2. 用户上传的图片（uploads/posts/xxx.jpg，由后端写入挂载卷）
    # 两者 URI 前缀都是 /imgs/，所以用 try_files 做回退。
    location /imgs/ {
        try_files $uri @tickethub_uploads;
    }
    location @tickethub_uploads {
        # /imgs/posts/a.jpg -> /opt/tickethub/uploads/posts/a.jpg
        rewrite ^/imgs/(.*)$ /$1 break;
        root /opt/tickethub/uploads;
    }

    # ---- 抢票接口：严格限流 ----
    # 真实接口路径是 /ticket-order/seckill/{tierId}，
    # 前端通过 /api 前缀访问，即 /api/ticket-order/seckill/...
    location /api/ticket-order/seckill/ {
        limit_req zone=tickethub_seckill burst=20 nodelay;
        limit_req_status 429;
        # 后端重启窗口内返回 JSON 而不是 HTML 页面（前端 axios 能识别）
        error_page 502 503 504 = @tickethub_api_unavailable;

        # 去掉 /api 前缀再转发：/api/ticket-order/seckill/1 -> /ticket-order/seckill/1
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://tickethub_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---- 其他 API：宽松限流 ----
    location /api/ {
        limit_req zone=tickethub_api burst=100 nodelay;
        limit_req_status 429;
        error_page 502 503 504 = @tickethub_api_unavailable;

        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://tickethub_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---- 后端不可用时的兜底页 ----
    # 两个命名 location 分别给 API 和页面用（nginx 的 error_page 可以
    # 在 location 内覆盖，所以 /api/ 和 / 各自指向自己的兜底页）。
    #
    # API：返回 JSON，前端 axios 拦截器能识别 success:false 并弹中文提示。
    location @tickethub_api_unavailable {
        internal;
        default_type application/json;
        add_header Retry-After 3 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"success":false,"errorMsg":"服务正在重启，请 3 秒后重试"}';
    }

    # 页面：返回自带 3 秒自动刷新的中文页，避免用户以为网站挂了。
    location @tickethub_page_unavailable {
        internal;
        default_type text/html;
        add_header Retry-After 3 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><meta charset="utf-8"><title>TicketHub 正在重启</title><body style="font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#faf7f2"><div style="text-align:center"><h1 style="font-size:20px;color:#8b1a1a">服务正在重启</h1><p style="color:#666">页面将在 3 秒后自动刷新</p></div><script>setTimeout(function(){location.reload()},3000)</script>';
    }

    # ---- 健康检查 ----
    # 只说明「nginx 活着」，不代表后端可用。
    # 想确认后端请用 /api/show-category/list（会打到 8081）。
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 挡掉常见扫描路径 ----
    # 这些是扫描器/爬虫最爱探测的路径（.env、.git、phpMyAdmin、备份文件等）。
    # 本项目一个都用不到，直接 444（nginx 关闭连接，不回任何响应），
    # 既不泄露信息，也不浪费带宽，还能让扫描器认为「这里没东西」。
    # 注意 1：\.git 后面要用 (/|$) 而不是只写 $，否则 /.git/config 这种
    #   「目录下有文件」的探测会漏掉（实测踩过：/.env 挡住了，/.git/config 还是 200）。
    # 注意 2：这里**不能**写 access_log off。fail2ban 靠日志抓扫描器，
    #   关掉日志等于让防护失效。改成单独写一个 scan.log，
    #   既不影响主日志的可读性，又能让 fail2ban 精确统计。
    # 注意 3：/config.json 这类「看似无害」的路径必须一起挡。
    #   本项目的 Vue Router 用 history 模式，任何不存在的路径都会回退到
    #   index.html 并返回 200，扫描器看到 200 就以为「找到配置文件了」，
    #   会加大扫描强度。所以在 nginx 层直接 444，别让它拿到 200。
    #   注意别误伤前端真实文件：dist 里没有 config.json，所以安全。
    location ~* /(\.env|\.git|\.svn|\.hg|\.DS_Store|\.aws|\.ssh|\.idea|\.vscode|\.htaccess|\.htpasswd|\.dockerenv|wp-admin|wp-login|wp-content|phpmyadmin|adminer|xmlrpc\.php|config\.json|config\.yml|config\.yaml|application\.properties|application\.yml)(/|$) {
        access_log /var/log/nginx/tickethub-scan.log;
        return 444;
    }
    # 备份/导出类文件：任意目录下的 *.sql / *.bak / *.old / *.zip / *.tar.gz
    location ~* \.(sql|bak|old|orig|swp|tar|tar\.gz|tgz|zip|7z|rar)$ {
        access_log /var/log/nginx/tickethub-scan.log;
        return 444;
    }

    # 只允许常规 HTTP 方法，挡掉扫描器常用的 OPTIONS/TRACE 探测。
    if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD)$) {
        return 444;
    }

    # ---- Vue Router history 模式回退 ----
    # 前端路由是 /show/1、/orders 这种真实路径，刷新时 nginx 上并不存在
    # 对应文件，必须回退到 index.html，由 Vue Router 在前端解析。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

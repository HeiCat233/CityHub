# TicketHub API 网关配置
# 放置到服务器 /etc/nginx/conf.d/tickethub.conf，前端静态资源由 OSS + CDN 托管

# ---- 限流区 ----
# 抢票接口：按客户端 IP 限速 10 次/秒，突发 20
limit_req_zone $binary_remote_addr zone=seckill:10m rate=10r/s;
# 其他接口：50 次/秒
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

# ---- 后端上游 ----
upstream tickethub_backend {
    server 127.0.0.1:8081 weight=1 max_fails=3 fail_timeout=10s;
    # 扩容时再启用下面一行，负载均衡立即生效
    # server 127.0.0.1:8082 weight=1 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    # 证书由 certbot 申请后自动写入
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 10m;
    access_log /var/log/nginx/tickethub.access.log;

    # 抢票接口：严格限流（第一层防刷，第二层是 Redis 滑动窗口/一人一单）
    location /api/ticket-order/seckill/ {
        limit_req zone=seckill burst=20 nodelay;
        limit_req_status 429;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://tickethub_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他 API
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://tickethub_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查（供探活/监控使用）
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
